name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev tooling (vitest 5, Astro 7) needs Node >= 22.12; Node 20
        # support of the published packages is covered by `runtime-node-20`.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The docs site (Astro, Node >= 22.12) is checked and built by docs.yml.
      - run: pnpm nx run-many -t lint typecheck test build conformance --exclude=docs
      # The published bundle must pass the expr-eval suite too, not only the sources.
      - run: pnpm nx run exprit:conformance
        env:
          CONFORMANCE_TARGET: dist

  runtime-node-20:
    # Builds on Node 22, then runs the built packages on Node 20, which the
    # published packages still support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build -p exprit cli

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: node tools/scripts/smoke-runtime.mjs
