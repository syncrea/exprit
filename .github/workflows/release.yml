name: Release

# Runs the whole `nx release` in CI: version bump (from conventional commits,
# or the specifier you choose), CHANGELOG.md, release commit, tag, push to
# origin, GitHub release, and npm publish. Nothing happens without approval:
#
# - After every green CI run on main, a release run starts and waits at the
#   `release` environment. Approve it ("Review deployments") to release that
#   exact commit; ignore it and it expires, so small commits never publish.
# - Or start it manually (Actions → Release → Run workflow) to choose the
#   version or do a dry run. It still waits for approval and only releases a
#   commit whose CI passed.
#
# npm authenticates this workflow via OIDC trusted publishing: no npm token is
# stored, no OTP is needed, and npm attaches provenance automatically. The
# trusted publisher on npmjs.com must name this repository, `release.yml` and
# the `release` environment.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version: empty = from conventional commits, or patch, minor, major, prerelease, or an exact version like 1.0.0'
        required: false
        default: ''
      dry-run:
        description: 'Dry run: show the version and changelog, change and publish nothing'
        type: boolean
        default: false
      publish-only:
        description: 'Recovery: only publish the version already tagged on main (after a release whose publish step failed)'
        type: boolean
        default: false

permissions:
  contents: write # release commit, tag and GitHub release
  id-token: write # OIDC token for npm trusted publishing
  actions: write # start the docs deployment afterwards

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # From CI: only after a successful run on a push to main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Release only a commit that is main's tip and passed CI
        if: ${{ inputs.publish-only != true }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::main is at ${head:0:7}, this run was for ${RELEASE_SHA:0:7}. Approve the release run of the newest commit instead."
            exit 1
          fi
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$head&status=success" --jq '.total_count')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed for ${head:0:7} yet."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      # No `registry-url` here: it writes an .npmrc with an empty token,
      # which can get in the way of OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; `pnpm publish` hands the
      # tarball to the npm on the PATH.
      - run: npm install --global npm@11.20.0

      - run: pnpm install --frozen-lockfile

      - name: Configure the release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish only the version tagged on main's tip
        if: ${{ inputs.publish-only == true }}
        run: |
          version=$(node -p "require('./packages/exprit/package.json').version")
          if [ "$(git rev-parse "v$version^{commit}" 2>/dev/null)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main's tip is not tagged v$version, so there is no finished release to publish."
            exit 1
          fi
          pnpm nx release publish

      - name: Version, changelog, tag, push, GitHub release and publish
        if: ${{ inputs.publish-only != true }}
        env:
          # Inputs go through the environment, never straight into the script.
          SPECIFIER: ${{ inputs.specifier }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--yes)
          if [ -n "$SPECIFIER" ]; then
            if ! [[ "$SPECIFIER" =~ ^(patch|minor|major|prepatch|preminor|premajor|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Invalid version specifier: $SPECIFIER"
              exit 1
            fi
            args=("$SPECIFIER" "${args[@]}")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          pnpm nx release "${args[@]}"

      # Commits pushed with the workflow token do not start other workflows,
      # so the docs site (and its version badge) is redeployed explicitly.
      - name: Redeploy the docs site
        if: ${{ inputs.dry-run != true }}
        run: gh workflow run docs.yml --ref main
