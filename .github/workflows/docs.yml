name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to main supersedes a queued one, but a
# running deployment is allowed to finish.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generates the API reference from the TSDoc comments (docs:api-docs)
      # and measures the bundle (docs:bundle-size), then builds the site.
      - name: Lint, typecheck and build the docs
        run: pnpm nx run-many -t lint typecheck build -p docs

      - name: Install Chromium for the smoke tests
        run: pnpm --dir apps/docs exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm nx run docs:e2e
        env:
          CI: 'true'

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
